<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boxman</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #262638;
    --wall: #45475a;
    --wall-edge: #313244;
    --floor: #11111b;
    --target: #313244;
    --target-dot: #f9e2af;
    --box: #cba6f7;
    --box-edge: #a97ff0;
    --box-done: #a6e3a1;
    --box-done-edge: #7fd07a;
    --player: #89b4fa;
    --player-edge: #5f8fdb;
    --text: #cdd6f4;
    --muted: #9399b2;
    --accent: #f38ba8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-size: 2rem;
    letter-spacing: 2px;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    color: var(--muted);
    margin-top: -8px;
    font-size: 0.9rem;
  }
  .hud {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    background: var(--panel);
    padding: 10px 18px;
    border-radius: 12px;
  }
  .hud .stat {
    font-size: 0.95rem;
    color: var(--muted);
  }
  .hud .stat b { color: var(--text); }
  .hud button {
    background: var(--wall);
    color: var(--text);
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.15s;
  }
  .hud button:hover { background: var(--box-edge); }
  .hud button:active { transform: translateY(1px); }
  #board {
    display: grid;
    gap: 2px;
    background: var(--wall-edge);
    padding: 6px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .cell {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    position: relative;
  }
  .wall {
    background: linear-gradient(145deg, var(--wall), #383a4d);
  }
  .floor { background: var(--floor); }
  .target { background: var(--target); }
  .target::after {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--target-dot);
    box-shadow: 0 0 6px var(--target-dot);
  }
  .box {
    background: var(--floor);
  }
  .box::after {
    content: "";
    width: 78%;
    height: 78%;
    background: var(--box);
    border: 3px solid var(--box-edge);
    border-radius: 6px;
  }
  .box.done::after {
    background: var(--box-done);
    border-color: var(--box-done-edge);
  }
  .player {
    background: var(--floor);
  }
  .player.on-target { background: var(--target); }
  .player::before {
    content: "";
    width: 62%;
    height: 62%;
    background: var(--player);
    border: 3px solid var(--player-edge);
    border-radius: 50%;
    z-index: 2;
  }
  #message {
    min-height: 28px;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--box-done);
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(2, 48px);
    gap: 6px;
    margin-top: 4px;
  }
  .controls button {
    background: var(--panel);
    color: var(--text);
    border: none;
    border-radius: 8px;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .controls button:active { background: var(--box-edge); }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  .levels {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 420px;
  }
  .levels button {
    background: var(--panel);
    color: var(--muted);
    border: 2px solid transparent;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .levels button.active {
    color: var(--text);
    border-color: var(--accent);
  }
  .levels button.cleared {
    color: var(--box-done);
  }
  footer {
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
  kbd {
    background: var(--wall);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <h1>BOX<span>MAN</span></h1>
  <div class="subtitle">Push every crate onto a glowing target to clear the level.</div>

  <div class="hud">
    <div class="stat">Level <b id="levelNum">1</b> / <b id="levelTotal"></b></div>
    <div class="stat">Moves: <b id="moveCount">0</b></div>
    <div class="stat">Pushes: <b id="pushCount">0</b></div>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div id="board"></div>
  <div id="message"></div>

  <div class="controls">
    <button id="up">&uarr;</button>
    <button id="left">&larr;</button>
    <button id="down">&darr;</button>
    <button id="right">&rarr;</button>
  </div>

  <div class="levels" id="levelPicker"></div>

  <footer>
    Move with <kbd>Arrow Keys</kbd> or <kbd>WASD</kbd>. Undo with <kbd>U</kbd> or <kbd>Backspace</kbd>. Reset with <kbd>R</kbd>.
  </footer>

<script>
(function () {
  const LEVELS = [
    ["######",
     "#    #",
     "# $. #",
     "#  @ #",
     "#    #",
     "######"],
    ["#######",
     "#     #",
     "# $ $ #",
     "# . . #",
     "#  @  #",
     "#     #",
     "#######"],
    ["#########",
     "#       #",
     "#  $    #",
     "#       #",
     "#    .  #",
     "#       #",
     "#  @    #",
     "#########"],
    ["#########",
     "#   #   #",
     "# $   $ #",
     "#   #   #",
     "# . # . #",
     "#   @   #",
     "#   #   #",
     "#########"],
    ["###########",
     "#         #",
     "# $     $ #",
     "#   ###   #",
     "#    @    #",
     "#   ###   #",
     "# .     . #",
     "#         #",
     "###########"],
    ["#########",
     "#       #",
     "# $   $ #",
     "#       #",
     "#   @   #",
     "#       #",
     "# .   . #",
     "#       #",
     "#########"],
  ];

  const boardEl = document.getElementById('board');
  const messageEl = document.getElementById('message');
  const moveCountEl = document.getElementById('moveCount');
  const pushCountEl = document.getElementById('pushCount');
  const levelNumEl = document.getElementById('levelNum');
  const levelTotalEl = document.getElementById('levelTotal');
  const levelPicker = document.getElementById('levelPicker');

  levelTotalEl.textContent = LEVELS.length;

  let currentLevel = 0;
  let grid = [];       // 'wall' | 'floor'
  let targets = new Set();
  let boxes = new Set();
  let player = { r: 0, c: 0 };
  let moves = 0;
  let pushes = 0;
  let history = [];
  const cleared = new Set(JSON.parse(localStorage.getItem('boxman-cleared') || '[]'));

  function key(r, c) { return r + ',' + c; }

  function loadLevel(index) {
    currentLevel = index;
    const rows = LEVELS[index];
    grid = [];
    targets = new Set();
    boxes = new Set();
    moves = 0;
    pushes = 0;
    history = [];
    messageEl.textContent = '';

    rows.forEach((row, r) => {
      const gridRow = [];
      [...row].forEach((ch, c) => {
        if (ch === '#') gridRow.push('wall');
        else gridRow.push('floor');
        if (ch === '.' || ch === '*' || ch === '+') targets.add(key(r, c));
        if (ch === '$' || ch === '*') boxes.add(key(r, c));
        if (ch === '@' || ch === '+') player = { r, c };
      });
      grid.push(gridRow);
    });

    render();
    renderLevelPicker();
  }

  function isWall(r, c) {
    if (r < 0 || r >= grid.length) return true;
    if (c < 0 || c >= grid[r].length) return true;
    return grid[r][c] === 'wall';
  }

  function isWon() {
    for (const t of targets) if (!boxes.has(t)) return false;
    return true;
  }

  function render() {
    const rows = grid.length;
    const cols = Math.max(...grid.map(r => r.length));
    boardEl.style.gridTemplateColumns = `repeat(${cols}, 40px)`;
    boardEl.innerHTML = '';

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        const k = key(r, c);
        if (isWall(r, c)) {
          cell.className = 'cell wall';
        } else {
          const isTarget = targets.has(k);
          const isBox = boxes.has(k);
          const isPlayer = player.r === r && player.c === c;
          let cls = 'cell floor';
          if (isTarget) cls = 'cell target';
          if (isBox) cls = 'cell box' + (isTarget ? ' done' : '');
          if (isPlayer) cls = 'cell player' + (isTarget ? ' on-target' : '');
          cell.className = cls;
        }
        boardEl.appendChild(cell);
      }
    }

    moveCountEl.textContent = moves;
    pushCountEl.textContent = pushes;
    levelNumEl.textContent = currentLevel + 1;
  }

  function renderLevelPicker() {
    levelPicker.innerHTML = '';
    LEVELS.forEach((_, i) => {
      const btn = document.createElement('button');
      btn.textContent = i + 1;
      if (i === currentLevel) btn.classList.add('active');
      if (cleared.has(i)) btn.classList.add('cleared');
      btn.addEventListener('click', () => loadLevel(i));
      levelPicker.appendChild(btn);
    });
  }

  function attemptMove(dr, dc) {
    if (isWon()) return;
    const nr = player.r + dr;
    const nc = player.c + dc;
    const nk = key(nr, nc);

    if (isWall(nr, nc)) return;

    let pushedBox = false;
    if (boxes.has(nk)) {
      const br = nr + dr, bc = nc + dc;
      const bk = key(br, bc);
      if (isWall(br, bc) || boxes.has(bk)) return;
      boxes.delete(nk);
      boxes.add(bk);
      pushedBox = true;
    }

    history.push({ player: { ...player }, boxKey: nk, pushedBox, targetKey: pushedBox ? key(nr + dr, nc + dc) : null });
    player = { r: nr, c: nc };
    moves++;
    if (pushedBox) pushes++;

    render();

    if (isWon()) {
      messageEl.textContent = `Level ${currentLevel + 1} cleared in ${moves} moves (${pushes} pushes)!`;
      cleared.add(currentLevel);
      localStorage.setItem('boxman-cleared', JSON.stringify([...cleared]));
      renderLevelPicker();
      if (currentLevel < LEVELS.length - 1) {
        setTimeout(() => loadLevel(currentLevel + 1), 1400);
      } else {
        messageEl.textContent += ' You beat all levels! 🎉';
      }
    }
  }

  function undo() {
    const last = history.pop();
    if (!last) return;
    player = last.player;
    if (last.pushedBox) {
      boxes.delete(last.targetKey);
      boxes.add(last.boxKey);
      pushes--;
    }
    moves--;
    messageEl.textContent = '';
    render();
  }

  function reset() {
    loadLevel(currentLevel);
  }

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('up').addEventListener('click', () => attemptMove(-1, 0));
  document.getElementById('down').addEventListener('click', () => attemptMove(1, 0));
  document.getElementById('left').addEventListener('click', () => attemptMove(0, -1));
  document.getElementById('right').addEventListener('click', () => attemptMove(0, 1));

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': attemptMove(-1, 0); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': attemptMove(1, 0); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': attemptMove(0, -1); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': attemptMove(0, 1); e.preventDefault(); break;
      case 'u': case 'U': case 'Backspace': undo(); e.preventDefault(); break;
      case 'r': case 'R': reset(); e.preventDefault(); break;
    }
  });

  loadLevel(0);
})();
</script>
</body>
</html>
